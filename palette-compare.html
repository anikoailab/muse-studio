<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse Studio - all three colours</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Neutral grey chrome on purpose: any colour here would bias how the three
   palettes underneath read against each other. */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Instrument Sans",-apple-system,system-ui,sans-serif;background:#1d1d20;color:#ececed}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:13px 20px;background:#141416;border-bottom:1px solid #2c2c31}
.title{font-size:14px;font-weight:600}
.title span{color:#8b8b95;font-weight:400}
.lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:#75757f}
.mini{padding:8px 15px;border-radius:999px;cursor:pointer;background:#212126;border:1.5px solid transparent;
  color:#d6d6da;font-size:13px;font-weight:600;font-family:inherit;transition:background .15s,border-color .15s}
.mini:hover{background:#292930}
.mini[aria-pressed="true"]{border-color:#6f6f7a;background:#2e2e36;color:#fff}
.note{margin-left:auto;font-size:12px;color:#75757f}
.note a{color:#b9b9c2}

.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px;align-items:start}
.col{min-width:0}
.head{display:flex;align-items:center;gap:9px;padding:2px 4px 10px}
.dot{width:17px;height:17px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.hex{font-size:11.5px;color:#75757f;margin-left:auto}
.blurb{padding:0 4px 10px;font-size:12.5px;line-height:1.5;color:#8b8b95;min-height:38px}
.viewport{position:relative;height:78vh;min-height:560px;border-radius:12px;overflow:hidden;
  background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.45)}
/* Each column is narrow, so the page inside is rendered wide and scaled down.
   That keeps the DESKTOP layout visible instead of collapsing to the phone one. */
iframe{border:0;width:1380px;height:1560px;transform-origin:0 0;background:#fff}
.pick{margin-top:10px;width:100%;padding:11px;border-radius:999px;border:none;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:700;color:#12121a;background:#d8d8de;
  transition:filter .15s,transform .12s}
.pick:hover{filter:brightness(1.06)}
.pick:active{transform:scale(.99)}
@media (max-width:1100px){
  .row{grid-template-columns:1fr}
  .viewport{height:70vh}
}
</style></head><body>

<div class="bar">
  <div class="title">muse studio <span>/ all three colours</span></div>
  <span class="lab">mode</span>
  <button class="mini" data-m="light">light</button>
  <button class="mini" data-m="dark">dark</button>
  <div class="note">each panel is the real page. open one full size:
    <a href="/palette-preview.html">the picker</a></div>
</div>

<div class="row" id="row"></div>

<script src="/palettes.js"></script>
<script>
let mode="light";
const row=document.getElementById("row");
const frames=[];

for(const key in window.PALETTES){
  const p=window.PALETTES[key];
  const col=document.createElement("div");
  col.className="col";
  col.innerHTML=
    '<div class="head"><span class="dot" style="background:'+p.swatch+'"></span>'+
    '<span class="name">'+p.label+'</span><span class="hex">'+p.swatch+'</span></div>'+
    '<div class="blurb">'+p.blurb+'</div>'+
    '<div class="viewport"><iframe title="'+p.label+' preview" src="/"></iframe></div>'+
    '<button class="pick" data-open="'+key+'">see '+p.label+' full size</button>';
  row.appendChild(col);
  const f=col.querySelector("iframe");
  f.dataset.pal=key;
  frames.push(f);
  f.addEventListener("load",()=>{window.applyPalette(f,key,mode);});
}

/* Scale each 1380px-wide render down to whatever the column actually is, so all
   three show the true desktop composition side by side. */
function fit(){
  for(const f of frames){
    const box=f.parentElement.getBoundingClientRect();
    const s=box.width/1380;
    f.style.transform="scale("+s+")";
    f.style.height=(box.height/s)+"px";
  }
}
function paint(){
  for(const b of document.querySelectorAll("[data-m]"))b.setAttribute("aria-pressed",b.dataset.m===mode);
}
document.querySelector(".bar").addEventListener("click",e=>{
  const m=e.target.closest("[data-m]");
  if(m){mode=m.dataset.m;paint();for(const f of frames)window.applyPalette(f,f.dataset.pal,mode);return;}
  const o=e.target.closest("[data-open]");
  if(o)location.href="/palette-preview.html?p="+o.dataset.open+"&m="+mode;
});
row.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");
  if(o)location.href="/palette-preview.html?p="+o.dataset.open+"&m="+mode;
});
addEventListener("resize",fit);
addEventListener("load",fit);
paint();fit();
</script>
</body></html>
